server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: user-service
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
