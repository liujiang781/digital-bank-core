server:
  port: ${SERVER_PORT:8082}
spring:
  datasource:
    url: ${ACCOUNT_DB_URL:jdbc:mysql://localhost:3306/payment_db?serverTimezone=Asia/Shanghai&characterEncoding=utf8}
    username: ${ACCOUNT_DB_USER:account_service}
    password: ${ACCOUNT_DB_PASSWORD:}
    hikari:
      connection-init-sql: SET time_zone = '+08:00'
      initialization-fail-timeout: -1
      connection-timeout: 3000
  sql:
    init:
      mode: never
  application:
    name: account-service
  jackson:
    time-zone: Asia/Shanghai
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
account:
  internal-token: ${ACCOUNT_INTERNAL_TOKEN:}
  deposit-single-limit: ${ACCOUNT_DEPOSIT_SINGLE_LIMIT:50000.00}
  outgoing-single-limit: ${ACCOUNT_OUTGOING_SINGLE_LIMIT:10000.00}
  outgoing-daily-limit: ${ACCOUNT_OUTGOING_DAILY_LIMIT:50000.00}

