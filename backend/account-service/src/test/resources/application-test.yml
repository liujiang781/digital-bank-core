spring:
  datasource:
    url: ${S2_TEST_DB_URL:jdbc:h2:mem:s2test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000}
    username: ${S2_TEST_DB_USER:sa}
    password: ${S2_TEST_DB_PASSWORD:}
    driver-class-name: ${S2_TEST_DB_DRIVER:org.h2.Driver}
    hikari:
      connection-init-sql: ${S2_TEST_DB_INIT_SQL:SET TIME ZONE '+08:00'}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql,classpath:db/s2-incremental.sql
account:
  internal-token: s2-test-service-token-32-bytes-long

